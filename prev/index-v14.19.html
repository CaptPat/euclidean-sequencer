const sk=Object.keys(styleBias);if(sk.length)rout.push(sk.map(k=>k[0].toUpperCase()+k.slice(1)).join('/'));

function genSong(seedStr,moodBias){
const seed=String(seedStr||'').trim().toUpperCase()||randSeed(),r=rng(hashStr('GB'+seed));
const keys=Object.keys(GSTY);let tw=keys.reduce((a,k)=>a+GSTY[k].w,0);
if(moodBias&&moodBias.styleBias){keys.forEach(k=>{if(moodBias.styleBias[k])tw+=moodBias.styleBias[k];});}
let u=r()*tw,sk=keys[0];for(const k of keys){let w=GSTY[k].w+(moodBias&&moodBias.styleBias&&moodBias.styleBias[k]||0);u-=w;if(u<0){sk=k;break;}}
const S=GSTY[sk];let bpm=ri(r,S.bpm[0],S.bpm[1]);if(moodBias&&moodBias.bpmBias)bpm=Math.max(10,Math.min(240,bpm+moodBias.bpmBias));
const key=pick(r,S.keys),scale=pick(r,S.sc);
const IDS=tracks.map(t=>t.id),ix={};IDS.forEach((id,i)=>ix[id]=i);
const g=IDS.map(id=>({id,v:rollSpec(r,{...GD[id],...(S.roll[id]||{})})}));
