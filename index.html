<script>
function bjorklund(k,n){n=Math.max(1,n|0);k=Math.max(0,Math.min(n,k|0));if(k===0)return Array(n).fill(0);

while(b.length>1){const m=Math.min(a.length,b.length),na=[];for(let i=0;i<m;i++)na.push(a[i].concat(b[i]));
const rest=a.length>m?a.slice(m):b.slice(m);a=na;b=rest;}return a.concat(b).flat();}
function rot(p,r){const n=p.length;r=((r%n)+n)%n;return p.slice(n-r).concat(p.slice(0,n-r));}
if(typeof module!=='undefined'){module.exports={bjorklund,rot};}
else{
const $=s=>document.querySelector(s);
const DRUMS=['kick','snare','hat','clave'],WAVES=['sine','triangle','sawtooth','square'],WNAME=['SIN','TRI','SAW','SQR'];

const MODES=['Root','Up','Down','Ping-pong','Random','Chord','Riff'],RIFF=[0,0,4,0,3,0,5,4],PROG=[0,3,4,2];
const G={key:9,scale:'Minor',bpm:110};
const M={vol:85,dt:3,fb:40,rev:35};
let ac=null,masterIn,outG,an,delayIn,dl,fbG,revIn,conv,noiseBuf,tracks=[],playing=false,nextT=0,timer,gstep=0,uiq=[],scopeSrc=null,scopeBuf;
// ---------- synth parameter maps (all knobs 0-100) ----------
const T={cut:v=>80*Math.pow(150,v/100),q:v=>.5+Math.pow(v/100,2)*17,a:v=>.002*Math.pow(1000,v/100),d:v=>.02*Math.pow(100,v/100),r:v=>.02*Math.pow(150,v/100),gate:v=>.25*Math.pow(128,v/100),lfo:v=>.1*Math.pow(200,v/100)};
const fT=s=>s<1?Math.round(s*1000)+'ms':s.toFixed(1)+'s',fHz=h=>h>=1000?(h/1000).toFixed(1)+'k':Math.round(h)+'Hz';
const SYN_DEF={wave:2,uni:1,det:10,cut:60,res:20,fenv:40,a:2,d:30,s:60,r:20,gate:35,dly:0,rev:0,lfoRate:30,lfoDepth:0,lfoTgt:'Off',oct:3,range:2};
const PATCH={
bass:{mode:'Riff',syn:{wave:2,uni:1,det:8,cut:30,res:35,fenv:55,a:0,d:28,s:15,r:12,gate:55,oct:1,range:2,rev:5}},
bell:{mode:'Root',syn:{wave:1,uni:2,det:6,cut:88,res:10,fenv:0,a:0,d:58,s:0,r:45,gate:10,oct:5,range:2,dly:30,rev:40}},
lead:{mode:'Ping-pong',syn:{wave:2,uni:3,det:14,cut:62,res:25,fenv:45,a:2,d:35,s:45,r:25,gate:45,oct:4,range:2,dly:35,rev:25,lfoRate:48,lfoDepth:14,lfoTgt:'Pitch'}},
pad:{mode:'Chord',syn:{wave:2,uni:5,det:22,cut:40,res:15,fenv:20,a:70,d:55,s:70,r:65,gate:62,oct:3,range:1,dly:20,rev:60,lfoRate:18,lfoDepth:30,lfoTgt:'Cutoff'}}};
const CLAVE={wave:3,uni:1,det:0,cut:75,res:40,fenv:0,a:0,d:22,s:0,r:10,gate:5,oct:6,range:1,dly:5,rev:15};
// ---------- note logic ----------
function deg2midi(s,d){const sc=SCALES[G.scale],base=12*(s.oct+1)+G.key;return base+sc[d%sc.length]+12*Math.floor(d/sc.length);}
function pickNotes(tr){const s=tr.syn,sc=SCALES[G.scale],L=sc.length*s.range,n=tr.hitN++,p=[];for(let i=0;i<L;i++)p.push(deg2midi(s,i));
switch(tr.mode){case 'Up':return[p[n%L]];case 'Down':return[p[L-1-n%L]];
case 'Ping-pong':{const P2=L>1?2*L-2:1,k=n%P2;return[p[k<L?k:P2-k]];}
case 'Random':return[p[Math.random()*L|0]];
case 'Chord':{const r=PROG[n%PROG.length];return[r,r+2,r+4].map(d=>deg2midi(s,d));}
case 'Riff':return[deg2midi(s,RIFF[n%RIFF.length])];
default:return[p[0]];}}
// ---------- audio graph ----------
function makeIR(c,dec){const sr=c.sampleRate,len=Math.max(1,Math.floor(sr*dec)),b=c.createBuffer(2,len,sr);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let y=0;for(let i=0;i<len;i++){const x=i/len;y+=.45*((Math.random()*2-1)-y);d[i]=y*Math.pow(1-x,3.2)*Math.min(1,i/(sr*.012));}}return b;}
const revDecay=()=>.4+M.rev/100*4.6;
function stepDur(){return 60/G.bpm/4;}
const anySolo=()=>tracks.some(t=>t.solo),audible=tr=>!tr.mute&&(!anySolo()||tr.solo);
function refreshAudible(){tracks.forEach(t=>{const a=audible(t);t.el.classList.toggle('dim',!a);if(t.gate&&ac){const v=a?1:0,n=ac.currentTime;[t.gate,t.gD,t.gR].forEach(g=>{g.gain.cancelScheduledValues(n);g.gain.setTargetAtTime(v,n,.015);});}});}
function updateDelay(t){if(!dl)return;const v=stepDur()*M.dt;if(t!=null)dl.delayTime.setValueAtTime(v,t);else dl.delayTime.setTargetAtTime(v,ac.currentTime,.05);}
function build(c){ac=c;noiseBuf=null;
masterIn=c.createGain();const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.18;
const lim=c.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.06;
const sat=c.createWaveShaper(),cv=new Float32Array(2049);for(let i=0;i<2049;i++){const x=i/1024-1;cv[i]=Math.tanh(x*1.15)/Math.tanh(1.15);}sat.curve=cv;sat.oversample='2x';
outG=c.createGain();outG.gain.value=M.vol/100*.92;masterIn.connect(comp);comp.connect(lim);lim.connect(sat);sat.connect(outG);outG.connect(c.destination);
an=c.createAnalyser();an.fftSize=1024;outG.connect(an);scopeBuf=new Float32Array(1024);
delayIn=c.createGain();dl=c.createDelay(4);fbG=c.createGain();fbG.gain.value=M.fb/100;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;const dR=c.createGain();dR.gain.value=.7;
delayIn.connect(dl);dl.connect(lp);lp.connect(fbG);fbG.connect(dl);lp.connect(dR);dR.connect(masterIn);dl.delayTime.value=stepDur()*M.dt;
revIn=c.createGain();conv=c.createConvolver();conv.buffer=makeIR(c,revDecay());const rR=c.createGain();rR.gain.value=.9;revIn.connect(conv);conv.connect(rR);rR.connect(masterIn);
tracks.forEach(t=>{t.gate=c.createGain();t.gD=c.createGain();t.gR=c.createGain();t.gate.connect(masterIn);t.gD.connect(delayIn);t.gR.connect(revIn);const v=audible(t)?1:0;t.gate.gain.value=t.gD.gain.value=t.gR.gain.value=v;});}
let irTimer;function rebuildIR(){clearTimeout(irTimer);irTimer=setTimeout(()=>{if(conv)conv.buffer=makeIR(ac,revDecay());},120);}
function noise(){if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const s=ac.createBufferSource();s.buffer=noiseBuf;return s;}
function env(g,t,v,d){g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);}
function send(node,amt,bus){if(amt<=0)return;const g=ac.createGain();g.gain.value=amt;node.connect(g);g.connect(bus);}
function play(s,t,vol,step,tr){const g=ac.createGain();g.connect(tr.gate);
if(s==='kick'){const o=ac.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.15);env(g,t,vol,.4);o.connect(g);o.start(t);o.stop(t+.45);}
else if(s==='snare'){const n=noise(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1200;n.connect(f);f.connect(g);env(g,t,vol*.7,.18);n.start(t);n.stop(t+.2);

else if(s==='hat'){const n=noise(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;n.connect(f);f.connect(g);env(g,t,vol*.5,.05);n.start(t);n.stop(t+.07);}
else{const o=ac.createOscillator(),o2=ac.createOscillator();o.type=o2.type='square';o.frequency.value=2500;o2.frequency.value=1660;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;o.connect(f);o2.connect(f);f.connect(g);env(g,t,vol*.3,.07);o.start(t);o2.start(t);o.stop(t+.1);o2.stop(t+.1);}}
function synthNote(tr,t,midi,gateSec){const s=tr.syn,c=ac,f0=440*Math.pow(2,(midi-69)/12);
const a=T.a(s.a),d=T.d(s.d),r=T.r(s.r),sus=s.s/100,g=Math.max(gateSec,a+.01),peak=.3*tr.vol/.8;

for(let k=0;k<n;k++){const o=c.createOscillator();o.type=WAVES[s.wave];o.frequency.value=f0;o.detune.value=n>1?((k/(n-1))*2-1)*s.det:0;o.connect(gn);o.start(t);o.stop(tEnd);oscs.push(o);}
gn.connect(flt);let last=flt;
if(s.lfoTgt!=='Off'&&s.lfoDepth>0){const lf=c.createOscillator(),lg=c.createGain(),D=s.lfoDepth/100;lf.frequency.value=T.lfo(s.lfoRate);lf.connect(lg);
if(s.lfoTgt==='Cutoff'){lg.gain.value=D*cut*.8;lg.connect(flt.frequency);}
else if(s.lfoTgt==='Pitch'){lg.gain.value=D*100;oscs.forEach(o=>lg.connect(o.detune));}
else{const tg=c.createGain();tg.gain.value=1-D/2;lg.gain.value=D/2;lg.connect(tg.gain);flt.connect(tg);last=tg;}
lf.start(t);lf.stop(tEnd);}

const gs=T.gate(tr.syn.gate)*stepDur();pickNotes(tr).forEach(m=>synthNote(tr,t,m,gs));}
function triggerStep(g,t){tracks.forEach(tr=>{const i=g%tr.pat.length;if(tr.pat[i]&&audible(tr))trigger(tr,t,i);});}
function sched(){while(nextT<ac.currentTime+.15){const t=nextT;triggerStep(gstep,t);tracks.forEach(tr=>uiq.push([t,tr,gstep%tr.pat.length]));gstep++;nextT+=stepDur();}}

// ---------- drawing ----------
const DPR=window.devicePixelRatio||1;
function fit(c,w,h){const cw=c.clientWidth||w,k=cw/w,W=Math.round(cw*DPR);if(c.width!==W){c.width=W;c.height=Math.round(h*k*DPR);}const x=c.getContext('2d');x.setTransform(DPR*k,0,0,DPR*k,0,0);x.clearRect(0,0,w,h);return x;}
function knob(el,label,min,max,get,set,fmt){const mx=typeof max==='function'?max:()=>max;const w=document.createElement('div');w.className='kn';const c=document.createElement('canvas');const b=document.createElement('b');w.append(label,c,b);el.append(w);
let hov=false,drag=false;const draw=()=>{const x=fit(c,100,100),v=get(),f=(v-min)/Math.max(1,mx()-min),act=hov||drag;w.classList.toggle('act',act);

if(act){x.save();x.strokeStyle='#ff6b4a';x.lineWidth=1.8;x.shadowColor='#ff6b4a';x.shadowBlur=10;x.beginPath();x.arc(C,C,48,0,7);x.stroke();x.restore();}

x.lineCap='round';x.lineWidth=5;x.strokeStyle='#2a2522';x.beginPath();x.arc(C,C,37,A0,A0+1.5*Math.PI);x.stroke();
if(f>0){x.save();x.strokeStyle='#ff6b4a';x.shadowColor='#ff6b4a';x.shadowBlur=10;x.beginPath();x.arc(C,C,37,A0,A1);x.stroke();x.restore();}
x.save();x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=10;x.shadowOffsetY=4;const g=x.createRadialGradient(C-8,C-10,2,C,C,30);g.addColorStop(0,'#4a4542');g.addColorStop(.6,'#24211f');g.addColorStop(1,'#141211');x.fillStyle=g;x.beginPath();x.arc(C,C,29,0,7);x.fill();x.restore();
if(x.createConicGradient){const cg=x.createConicGradient(0,C,C);for(let i=0;i<=8;i++)cg.addColorStop(i/8,i%2?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)');x.fillStyle=cg;x.beginPath();x.arc(C,C,29,0,7);x.fill();}
const bv=x.createLinearGradient(0,C-29,0,C+29);bv.addColorStop(0,'rgba(255,255,255,.28)');bv.addColorStop(.5,'rgba(255,255,255,0)');bv.addColorStop(1,'rgba(0,0,0,.5)');x.strokeStyle=bv;x.lineWidth=1.5;x.beginPath();x.arc(C,C,28.5,0,7);x.stroke();
x.strokeStyle='#fff';x.lineWidth=3.5;x.beginPath();x.moveTo(C+Math.cos(A1)*9,C+Math.sin(A1)*9);x.lineTo(C+Math.cos(A1)*23,C+Math.sin(A1)*23);x.stroke();b.textContent=fmt?fmt(v):v;};
const cl=v=>Math.round(Math.max(min,Math.min(mx(),v)));
c.onpointerenter=()=>{hov=true;draw();};c.onpointerleave=()=>{hov=false;draw();};
let sy=null,sv=0,sens=6;c.onpointerdown=e=>{sy=e.clientY;sv=get();sens=Math.min(24,Math.max(1.2,120/Math.max(1,mx()-min)));drag=true;c.setPointerCapture(e.pointerId);};
c.onpointermove=e=>{if(sy===null)return;set(cl(sv+(sy-e.clientY)/sens));draw();};
c.onpointerup=()=>{sy=null;drag=false;draw();};c.onwheel=e=>{e.preventDefault();set(cl(get()+(e.deltaY<0?1:-1)));draw();};return draw;}
function drawViz(tr,cv){const n=tr.pat.length,S=240,x=fit(cv,S,S),C=S/2,R=88,now=performance.now();
let g=x.createRadialGradient(C,C,60,C,C,118);g.addColorStop(0,'#0b0a0a');g.addColorStop(.85,'#050404');g.addColorStop(1,'#000');x.fillStyle=g;x.beginPath();x.arc(C,C,117,0,7);x.fill();
g=x.createRadialGradient(C,C,95,C,C,118);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.9)');x.fillStyle=g;x.fill();
x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;x.beginPath();x.arc(C,C,117.5,0,7);x.stroke();
x.strokeStyle='#cfcac6';x.lineWidth=3;x.beginPath();x.arc(C,C,R,0,7);x.stroke();
const pt=(i,r=R)=>{const a=i/n*2*Math.PI-Math.PI/2;return[C+Math.cos(a)*r,C+Math.sin(a)*r];};
x.strokeStyle='#8f8a86';x.lineWidth=2;for(let i=0;i<n;i++){const[a1,b1]=pt(i,R-7),[a2,b2]=pt(i,R+7);x.beginPath();x.moveTo(a1,b1);x.lineTo(a2,b2);x.stroke();}
const hs=[];for(let i=0;i<n;i++)if(tr.pat[i])hs.push(pt(i));
if(hs.length>1){x.save();x.beginPath();hs.forEach((p,j)=>j?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fillStyle='rgba(255,107,74,.22)';x.fill();x.strokeStyle='#ff6b4a';x.lineWidth=2.5;x.shadowColor='#ff6b4a';x.shadowBlur=12;x.stroke();x.restore();}
if(tr.cur>=0){const ang=tr.cur/n*2*Math.PI-Math.PI/2,[px,py]=pt(tr.cur,R+16);x.save();x.strokeStyle='#ff6b4a';x.shadowColor='#ff6b4a';x.shadowBlur=10;x.lineWidth=3;x.lineCap='round';
x.beginPath();x.moveTo(C,C);x.lineTo(px,py);x.stroke();const ar=58,a0=ang-1.3;x.lineWidth=2.5;x.beginPath();x.arc(C,C,ar,a0,ang-.08);x.stroke();
const ex=C+Math.cos(ang-.08)*ar,ey=C+Math.sin(ang-.08)*ar,tx=-Math.sin(ang),ty=Math.cos(ang);x.fillStyle='#ff6b4a';x.beginPath();x.moveTo(ex+tx*7,ey+ty*7);x.lineTo(ex-tx*2+Math.cos(ang)*6,ey-ty*2+Math.sin(ang)*6);x.lineTo(ex-tx*2-Math.cos(ang)*6,ey-ty*2-Math.sin(ang)*6);x.fill();x.restore();}
x.fillStyle='#ff6b4a';x.beginPath();x.arc(C,C,4.5,0,7);x.fill();
for(let i=0;i<n;i++){if(!tr.pat[i])continue;const[px,py]=pt(i);const fl=Math.max(0,1-(now-(tr.flash[i]||0))/300),r=7.5+5*fl;x.save();x.shadowColor='#ff6b4a';x.shadowBlur=12+30*fl;
const rg=x.createRadialGradient(px-r*.35,py-r*.35,1,px,py,r);rg.addColorStop(0,fl>0?'#fff':'#ffb19c');rg.addColorStop(.5,'#ff6b4a');rg.addColorStop(1,'#d9472c');x.fillStyle=rg;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.restore();}}
// ---------- tracks ----------
const mkSel=(opts,val,fn)=>{const s=document.createElement('select');opts.forEach(o=>s.add(new Option(o,o)));s.value=val;s.onchange=()=>fn(s.value);return s;};
function addTrack(o){const tr={id:o.id,name:o.name,drum:!!o.drum,sound:o.sound,vol:o.vol,mute:false,solo:false,cur:-1,flash:{},hitN:0,hits:0,steps:16,rot:0,pat:[],synKnobs:[]};
if(!tr.drum){const p=PATCH[o.id];tr.defSyn={...SYN_DEF,...p.syn};tr.defMode=p.mode;tr.syn={...tr.defSyn};tr.mode=p.mode;}
const el=document.createElement('div');el.className='tr';tr.el=el;
el.innerHTML=`<div class="hd"><span class="led"></span><span class="t">EUCLIDEAN</span><input value="${o.name}" style="background:none;border:0;color:#aaa;width:70px">${tr.drum?'':'<button class="sy">SYNTH ▾</button>'}<span class="e"></span></div><div class="bd"><canvas class="viz"></canvas><div class="rt"><div class="knobs"></div><div class="steps"></div><div class="ctl"><span class="sl"></span><button class="m" title="Mute">M</button><button class="so" title="Solo (Alt/Shift-click = exclusive solo)">S</button>Vol<input type="range" min="0" max="1" step=".01" value="${o.vol}"></div></div></div>`;
$('#tracks').append(el);const cv=el.querySelector('canvas.viz'),stEl=el.querySelector('.steps'),kn=el.querySelector('.knobs');
const regen=()=>{tr.hits=Math.min(tr.hits,tr.steps);tr.rot=Math.min(tr.rot,tr.steps-1);tr.pat=rot(bjorklund(tr.hits,tr.steps),tr.rot);tr.draw();};
const ks=[knob(kn,'HITS',0,()=>tr.steps,()=>tr.hits,v=>{tr.hits=v;regen();}),knob(kn,'STEPS',1,32,()=>tr.steps,v=>{tr.steps=v;regen();}),knob(kn,'ROTATE',0,()=>Math.max(0,tr.steps-1),()=>tr.rot,v=>{tr.rot=v;regen();})];
const sl=el.querySelector('.sl');let selSound=null,selMode=null;
if(tr.drum){selSound=mkSel(DRUMS,tr.sound,v=>tr.sound=v);sl.replaceWith(selSound);}else{selMode=mkSel(MODES,tr.mode,v=>tr.mode=v);selMode.title='Note mode: how hits pick notes in the key';sl.replaceWith(selMode);}
el.querySelector('input[type=range]').oninput=e=>tr.vol=+e.target.value;
el.querySelector('.hd input').onchange=e=>tr.name=e.target.value;
el.querySelector('.m').onclick=e=>{tr.mute=!tr.mute;e.target.classList.toggle('on',tr.mute);refreshAudible();};
el.querySelector('.so').onclick=e=>{const only=tr.solo&&tracks.filter(t=>t.solo).length===1;
if(e.altKey||e.shiftKey){tracks.forEach(t=>t.solo=false);tr.solo=!only;}else tr.solo=!tr.solo;
tracks.forEach(t=>t.el.querySelector('.so').classList.toggle('on',t.solo));refreshAudible();};
if(!tr.drum){const syn=document.createElement('div');syn.className='syn';el.append(syn);
const grp=t=>{const g=document.createElement('div');g.className='grp';g.innerHTML=`<h4>${t}</h4><div class="kk"></div>`;syn.append(g);return g.querySelector('.kk');};
const K=(box,key,label,min,max,fmt)=>tr.synKnobs.push(knob(box,label,min,max,()=>tr.syn[key],v=>{tr.syn[key]=v;},fmt));
let b=grp('OSCILLATOR');K(b,'wave','WAVE',0,3,v=>WNAME[v]);K(b,'uni','UNISON',1,5);K(b,'det','DETUNE',0,50,v=>v+'c');
b=grp('FILTER');K(b,'cut','CUTOFF',0,100,v=>fHz(T.cut(v)));K(b,'res','RESO',0,100);K(b,'fenv','ENV AMT',0,100);
b=grp('AMP ENVELOPE');K(b,'a','ATTACK',0,100,v=>fT(T.a(v)));K(b,'d','DECAY',0,100,v=>fT(T.d(v)));K(b,'s','SUSTAIN',0,100);K(b,'r','RELEASE',0,100,v=>fT(T.r(v)));K(b,'gate','GATE',0,100,v=>T.gate(v).toFixed(1)+'st');
b=grp('LFO');K(b,'lfoRate','RATE',0,100,v=>T.lfo(v).toFixed(1)+'Hz');K(b,'lfoDepth','DEPTH',0,100);
const tw=document.createElement('div');tw.className='kn';tw.append('TARGET');const tsel=mkSel(['Off','Cutoff','Pitch','Volume'],tr.syn.lfoTgt,v=>tr.syn.lfoTgt=v);tw.append(tsel);b.append(tw);
b=grp('FX SENDS');K(b,'dly','DELAY',0,100);K(b,'rev','REVERB',0,100);
b=grp('NOTES');K(b,'oct','OCTAVE',0,6);K(b,'range','RANGE',1,3,v=>v+'oct');
tr.drawSyn=()=>{tr.synKnobs.forEach(k=>k());tsel.value=tr.syn.lfoTgt;};
const btn=el.querySelector('.sy');btn.onclick=()=>{const was=el.classList.contains('open');tracks.forEach(t=>{t.el.classList.remove('open');const s=t.el.querySelector('.sy');if(s){s.classList.remove('on');s.textContent='SYNTH ▾';}});
if(!was){el.classList.add('open');btn.classList.add('on');btn.textContent='SYNTH ▴';tr.drawSyn();tracks.forEach(t=>t.draw());el.scrollIntoView({block:'nearest',behavior:'smooth'});}else tracks.forEach(t=>t.draw());};}
tr.sync=()=>{if(selMode)selMode.value=tr.mode;if(tr.drawSyn&&el.classList.contains('open'))tr.drawSyn();};
tr.drawSteps=()=>{const n=tr.pat.length;
if(stEl.querySelectorAll('.st').length!==n){stEl.innerHTML='';for(let i=0;i<n;i++){const s=document.createElement('div');s.className='st';s.onclick=()=>{tr.pat[i]^=1;tr.draw();};stEl.append(s);}}
[...stEl.querySelectorAll('.st')].forEach((s,i)=>s.classList.toggle('h',!!tr.pat[i]));};
tr.anim=()=>{let ph=stEl.querySelector('.ph');if(!ph){ph=document.createElement('div');ph.className='ph';stEl.append(ph);}
const st=stEl.querySelectorAll('.st')[tr.cur];if(tr.cur>=0&&st){ph.style.display='block';ph.style.left=st.offsetLeft+'px';}else ph.style.display='none';drawViz(tr,cv);};
tr.draw=()=>{ks.forEach(k=>k());el.querySelector('.e').textContent=`E(${tr.pat.reduce((a,b)=>a+b,0)},${tr.pat.length})`;tr.drawSteps();tr.anim();};
tr.set=(h,st,r)=>{tr.steps=st;tr.hits=h;tr.rot=r||0;regen();};tracks.push(tr);regen();return tr;}
// ---------- master panel ----------
let masterEl,scopeCv,pkEl,pkHold=0;
function addMaster(){const el=document.createElement('div');el.className='tr master';
el.innerHTML='<div class="hd"><span class="led"></span><span class="t">MASTER</span><span class="sub">COMPRESSOR · LIMITER · DELAY · REVERB</span><span class="e">-∞ dB</span></div><div class="bd"><canvas class="scope"></canvas><div class="knobs"></div></div>';
$('#tracks').append(el);masterEl=el;scopeCv=el.querySelector('.scope');pkEl=el.querySelector('.e');const kn=el.querySelector('.knobs');
const ks=[knob(kn,'VOLUME',0,100,()=>M.vol,v=>{M.vol=v;if(outG)outG.gain.value=v/100*.92;}),
knob(kn,'DLY TIME',1,8,()=>M.dt,v=>{M.dt=v;updateDelay();},v=>v+'st'),
knob(kn,'DLY FDBK',0,90,()=>M.fb,v=>{M.fb=v;if(fbG)fbG.gain.value=v/100;}),
knob(kn,'REV DECAY',0,100,()=>M.rev,v=>{M.rev=v;rebuildIR();},v=>revDecay().toFixed(1)+'s')];
masterEl.draw=()=>ks.forEach(k=>k());masterEl.draw();}
function drawScope(){if(!scopeCv)return;const W=scopeCv.clientWidth,H=scopeCv.clientHeight;if(!W)return;if(scopeCv.width!==Math.round(W*DPR)){scopeCv.width=Math.round(W*DPR);scopeCv.height=Math.round(H*DPR);}
const x=scopeCv.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,W,H);
x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,H*i/4);x.lineTo(W,H*i/4);x.stroke();}
let d=null;if(scopeSrc)d=scopeSrc();else if(an&&playing){an.getFloatTimeDomainData(scopeBuf);d=scopeBuf;}
let pk=0;x.save();x.strokeStyle='#ff6b4a';x.lineWidth=1.6;x.shadowColor='#ff6b4a';x.shadowBlur=8;x.beginPath();
const N=d?d.length:2;for(let i=0;i<N;i++){const v=d?d[i]:0;pk=Math.max(pk,Math.abs(v));const px=i/(N-1)*W,py=H/2-v*H*.45;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();x.restore();
pkHold=Math.max(pk,pkHold*.94);pkEl.textContent=pkHold>.0005?(20*Math.log10(pkHold)).toFixed(1)+' dB':'-∞ dB';}
// ---------- presets ----------
const Z=[0,16,0];
const P={'Four on floor E(4,8)':{t:[[4,8,0],[2,16,4],[8,16,1],[4,16,2],Z,Z,Z]},
'Tresillo E(3,8)':{t:[[3,8,0],[2,16,4],[4,8,1],[3,8,0],Z,Z,Z]},
'Dembow':{t:[[4,8,0],[3,8,0],[8,16,1],[3,8,0],Z,Z,Z]},
'Cinquillo E(5,8)':{t:[[4,16,0],Z,[8,16,1],[3,8,0],[5,8,0],Z,Z],syn:{bell:CLAVE}},
'Bossa clave E(5,16)':{t:[[4,16,0],Z,[8,16,1],[4,16,3],[5,16,0],Z,Z],syn:{bell:CLAVE}},
'Bembe bell E(7,12)':{t:[[4,12,0],[2,12,3],[6,12,1],Z,[7,12,0],Z,Z]},
'Electronic':{t:[[4,16,0],[2,16,4],[8,16,1],[12,16,15],Z,Z,Z]},
'Synthwave (A minor)':{bpm:108,key:9,scale:'Minor',t:[[4,16,0],[2,16,4],[8,16,1],[9,16,0],Z,[7,16,2],[2,32,0]],
 syn:{bass:{cut:34,res:40,fenv:65,gate:60},lead:{cut:68,dly:45,rev:30},pad:{cut:45,rev:65}},mode:{lead:'Ping-pong',pad:'Chord',bass:'Riff'}},
'Dorian Dream (polyrhythm)':{bpm:92,key:2,scale:'Dorian',t:[[3,8,0],Z,[5,12,0],[5,16,2],[7,12,0],[5,7,0],[3,32,0]],
 syn:{bass:{wave:1,cut:40,fenv:30},bell:{oct:5,range:2,dly:45,rev:55},lead:{wave:1,uni:2,det:10,cut:70,dly:50,rev:45,oct:4},pad:{wave:2,cut:42,rev:75,gate:70}},mode:{bell:'Random',lead:'Up',bass:'Riff'}}};
function applyP(p){tracks.forEach((tr,i)=>{if(!tr.drum){tr.syn={...tr.defSyn,...((p.syn||{})[tr.id]||{})};tr.mode=((p.mode||{})[tr.id])||tr.defMode;}tr.set(...p.t[i]);tr.sync();});
if(p.key!=null){G.key=p.key;$('#key').value=p.key;}if(p.scale){G.scale=p.scale;$('#scale').value=p.scale;}if(p.bpm){setBpm(p.bpm);}}
function setBpm(v){G.bpm=v;$('#bpm').value=v;$('#bv').textContent=v;updateDelay();}
NOTE_NAMES.forEach((n,i)=>$('#key').add(new Option(n,i)));Object.keys(SCALES).forEach(s=>$('#scale').add(new Option(s,s)));$('#key').value=G.key;$('#scale').value=G.scale;
$('#key').onchange=e=>G.key=+e.target.value;$('#scale').onchange=e=>G.scale=e.target.value;
for(const k in P)$('#pre').add(new Option(k,k));
$('#pre').onchange=e=>{if(P[e.target.value])applyP(P[e.target.value]);};
$('#play').onclick=toggle;$('#bpm').oninput=e=>setBpm(+e.target.value);
document.onkeydown=e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();toggle();}};
const DEFS=[['Kick','kick',.8,[4,16,0]],['Snare','snare',.8,[2,16,4]],['Hat','hat',.7,[8,16,1]]];
DEFS.forEach(d=>addTrack({name:d[0],id:d[1],drum:true,sound:d[1],vol:d[2]}).set(...d[3]));
[['Bass','bass',.8,[5,16,2]],['Bell','bell',.6,Z],['Lead','lead',.6,Z],['Pad','pad',.6,Z]].forEach(d=>addTrack({name:d[0],id:d[1],vol:d[2]}).set(...d[3]));
addMaster();
(function loop(){if(playing&&ac){const now=ac.currentTime-(ac.outputLatency||0);while(uiq.length&&uiq[0][0]<=now){const[,tr,i]=uiq.shift();tr.cur=i;if(tr.pat[i])tr.flash[i]=performance.now();}tracks.forEach(t=>t.anim());}drawScope();requestAnimationFrame(loop);})();
window.__gb={audible,refreshAudible,tracks:()=>tracks,P,applyP,build,triggerStep,setBpm,updateDelay,M,G,drawScope,setScope:f=>{scopeSrc=f;},resetCounters:()=>tracks.forEach(t=>t.hitN=0),ac:()=>ac};
}
