function bjorklund(k,n){n=Math.max(1,n|0);k=Math.max(0,Math.min(n,k|0));if(k===0)return Array(n).fill(0);

while(b.length>1){const m=Math.min(a.length,b.length),na=[];for(let i=0;i<m;i++)na.push(a[i].concat(b[i]));
const rest=a.length>m?a.slice(m):b.slice(m);a=na;b=rest;}return a.concat(b).flat();}
function rot(p,r){const n=p.length;r=((r%n)+n)%n;return p.slice(n-r).concat(p.slice(0,n-r));}
